<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 일기장</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loginContainer" class="container login-container">
        <div class="login-box">
            <h1>📓 내 일기장</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="btn btn-primary">로그인</button>
            </form>
            <p class="toggle-text">계정이 없으신가요? <a href="#" id="toSignup">회원가입</a></p>
        </div>
    </div>

    <div id="signupContainer" class="container login-container" style="display:none;">
        <div class="login-box">
            <h1>📓 회원가입</h1>
            <form id="signupForm">
                <div class="form-group">
                    <label for="newUsername">아이디</label>
                    <input type="text" id="newUsername" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">비밀번호</label>
                    <input type="password" id="newPassword" placeholder="비밀번호를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required>
                </div>
                <button type="submit" class="btn btn-primary">회원가입</button>
            </form>
            <p class="toggle-text">이미 계정이 있으신가요? <a href="#" id="toLogin">로그인</a></p>
        </div>
    </div>

    <div id="diaryContainer" class="container diary-container" style="display:none;">
        <header class="header">
            <h1>📓 내 일기장</h1>
            <div class="header-right">
                <span id="currentUser"></span>
                <button id="logoutBtn" class="btn btn-secondary">로그아웃</button>
            </div>
        </header>

        <main class="main-content">
            <div class="diary-input-section">
                <h2>오늘의 일기</h2>
                <div class="form-group">
                    <label for="diaryTitle">제목</label>
                    <input type="text" id="diaryTitle" placeholder="일기 제목을 입력하세요">
                </div>

                <!-- 기분 선택 -->
                <div class="form-group">
                    <label>오늘의 기분</label>
                    <div class="mood-selector">
                        <button type="button" class="mood-btn" data-mood="😊" title="행복">😊</button>
                        <button type="button" class="mood-btn" data-mood="😔" title="슬픔">😔</button>
                        <button type="button" class="mood-btn" data-mood="😠" title="화남">😠</button>
                        <button type="button" class="mood-btn" data-mood="😨" title="놀람">😨</button>
                        <button type="button" class="mood-btn" data-mood="😐" title="무표정">😐</button>
                        <button type="button" class="mood-btn" data-mood="🥰" title="사랑">🥰</button>
                    </div>
                    <input type="hidden" id="selectedMood" value="">
                    <div id="moodDisplay" class="mood-display"></div>
                </div>

                <div class="form-group">
                    <label for="diaryContent">내용</label>
                    <textarea id="diaryContent" placeholder="오늘 하루를 기록하세요..." rows="8"></textarea>
                </div>

                <!-- 사진 업로드 -->
                <div class="form-group">
                    <label for="diaryImage">사진 추가</label>
                    <input type="file" id="diaryImage" accept="image/*">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="form-group">
                    <label for="diaryDate">날짜</label>
                    <input type="date" id="diaryDate">
                </div>
                <button id="saveDiaryBtn" class="btn btn-primary">저장하기</button>
            </div>

            <div class="diary-list-section">
                <h2>일기 목록</h2>
                <div id="diaryList" class="diary-list"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
